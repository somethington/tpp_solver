services:
  tppsolver-streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tppsolver-streamlit
    networks:
      - default
      - nginx-net
    restart: unless-stopped
    # The image ENTRYPOINT already launches Streamlit on port 8501.
    environment:
      VIRTUAL_HOST: tppsolver.gnps2.org
      VIRTUAL_PORT: 8501
      LETSENCRYPT_HOST: tppsolver.gnps2.org
      LETSENCRYPT_EMAIL: mwang87@gmail.com

networks:
  nginx-net:
    external: true
